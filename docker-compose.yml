version: '3.8'

services:
  # Shared Redis instance for atomic counter/token tracking
  redis:
    image: redis:7-alpine
    container_name: ratelimiter-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Shared Postgres database for API keys, tiers, and request logs
  postgres:
    image: postgres:16-alpine
    container_name: ratelimiter-postgres
    environment:
      POSTGRES_DB: ratelimiter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ratelimiter"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Migration and seeding init container
  db-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: ratelimiter-db-init
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/ratelimiter
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy

  # Fictitious backend service proxied by the gateway cluster
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ratelimiter-backend
    ports:
      - "3001:3001"

  # Gateway Instance 1
  gateway-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: ratelimiter-gateway-1
    environment:
      PORT: 3000
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/ratelimiter
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # Gateway Instance 2
  gateway-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: ratelimiter-gateway-2
    environment:
      PORT: 3000
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/ratelimiter
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # Gateway Instance 3
  gateway-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: ratelimiter-gateway-3
    environment:
      PORT: 3000
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/ratelimiter
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # Nginx load balancer entrypoint
  nginx:
    image: nginx:alpine
    container_name: ratelimiter-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3

  # React Admin Dashboard
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: ratelimiter-dashboard
    ports:
      - "5173:5173"
    depends_on:
      - gateway-1
