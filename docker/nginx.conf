events {
    worker_connections 1024;
}

http {
    upstream gateway_cluster {
        least_conn;
        server gateway-1:3000 max_fails=3 fail_timeout=5s;
        server gateway-2:3000 max_fails=3 fail_timeout=5s;
        server gateway-3:3000 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://gateway_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass rate limit headers back to client
            proxy_pass_header X-RateLimit-Limit;
            proxy_pass_header X-RateLimit-Remaining;
            proxy_pass_header X-RateLimit-Reset;
            proxy_pass_header Retry-After;
        }
    }
}
